name: Collect trending & deploy

on:
  schedule:
    # 09:00 JST every day (cron is in UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['data/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: trending
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run collect
      - name: Commit data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m "data: $(TZ=Asia/Tokyo date +%F)"
            git push
          fi

  deploy:
    needs: collect
    # Run after a successful collect, or on its own for pushes (collect skipped).
    if: always() && (needs.collect.result == 'success' || needs.collect.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Pick up the data commit pushed by the collect job.
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
